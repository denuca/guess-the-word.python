<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Guess The Word - An accessible word guessing game similar to Wordle">
    <title>{% block title %}Guess The Word Game{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <!-- Skip to main content link for screen readers -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
</head>
<body>
    <header role="banner">
        <nav role="navigation" aria-label="Main navigation">
            <h1><a href="{{ url_for('home.index') }}" aria-label="Guess The Word home page">Guess The Word</a></h1>
            <ul>
                <li><a href="{{ url_for('home.index') }}" {% if request.endpoint == 'home.index' %}aria-current="page"{% endif %}>Home</a></li>
                <li><a href="{{ url_for('home.about') }}" {% if request.endpoint == 'home.about' %}aria-current="page"{% endif %}>About</a></li>
            </ul>
        </nav>
    </header>
    
    <main id="main-content" role="main" tabindex="-1">
        {% block content %}{% endblock %}
    </main>
    
    <footer role="contentinfo">
        <p>&copy; 2024 Guess The Word Game - Accessible word guessing game</p>
    </footer>
    
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
